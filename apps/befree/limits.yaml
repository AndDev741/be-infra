# What this app may take from the node, so one app can never starve the others.
# Today: requests ~80Mi, limits ~224Mi (backend, nginx); the database is in data/.
# Room for one rolling-update surge.
# There is no CPU limit on purpose: a quota on CPU requests is enough to keep
# scheduling honest, and CPU limits only throttle a node that has idle cores.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: befree
  namespace: befree
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.memory: 1Gi
    pods: "15"
    persistentvolumeclaims: "1"
    services.nodeports: "0"
---
# Defaults for any container that does not declare its own (the quota above
# refuses a pod without requests and limits, so these keep one-off pods working).
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: befree
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { memory: 256Mi }
