apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: befree
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: befree
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: befree
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: befree-db, key: user }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: befree-db, key: password }
            # Postgres refuses an initdb directly on the volume root (lost+found)
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits: { memory: 300Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
