apiVersion: apps/v1
kind: Deployment
metadata:
  name: befree-backend
  namespace: befree
spec:
  replicas: 1
  selector:
    matchLabels:
      app: befree-backend
  template:
    metadata:
      labels:
        app: befree-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/anddev741/befree-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://postgres:5432/befree
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: befree-db, key: user }
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: befree-db, key: password }
            # Created out-of-band, never committed:
            #   kubectl -n befree create secret generic befree-whatsapp \
            #     --from-literal=access-token=<System User token> \
            #     --from-literal=phone-number-id=<Phone number ID> \
            #     --from-literal=verify-token=<random string you chose> \
            #     --from-literal=app-secret=<App secret> \
            #     --from-literal=allowed-phones=<351912345678>
            - name: WHATSAPP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef: { name: befree-whatsapp, key: access-token, optional: true }
            - name: WHATSAPP_PHONE_NUMBER_ID
              valueFrom:
                secretKeyRef: { name: befree-whatsapp, key: phone-number-id, optional: true }
            - name: WHATSAPP_VERIFY_TOKEN
              valueFrom:
                secretKeyRef: { name: befree-whatsapp, key: verify-token, optional: true }
            - name: WHATSAPP_APP_SECRET
              valueFrom:
                secretKeyRef: { name: befree-whatsapp, key: app-secret, optional: true }
            - name: WHATSAPP_ALLOWED_PHONES
              valueFrom:
                secretKeyRef: { name: befree-whatsapp, key: allowed-phones, optional: true }
            # AI assistant (DeepSeek, OpenAI-compatible). Without it the chat falls back to the regex parser:
            #   kubectl -n befree create secret generic befree-deepseek --from-literal=api-key=<sk-...>
            - name: QUARKUS_LANGCHAIN4J_OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: befree-deepseek, key: api-key, optional: true }
            # Voice notes (Groq/OpenAI Whisper). Optional:
            #   kubectl -n befree create secret generic befree-transcription --from-literal=api-key=<gsk_...>
            - name: BEFREE_TRANSCRIPTION_API_KEY
              valueFrom:
                secretKeyRef: { name: befree-transcription, key: api-key, optional: true }
            # Login password and the key that signs the session cookie. Without the
            # key, every restart logs you out:
            #   kubectl -n befree create secret generic befree-auth \
            #     --from-literal=password='<your password>' \
            #     --from-literal=session-key="$(openssl rand -base64 32)"
            - name: BEFREE_PASSWORD
              valueFrom:
                secretKeyRef: { name: befree-auth, key: password, optional: true }
            - name: BEFREE_SESSION_KEY
              valueFrom:
                secretKeyRef: { name: befree-auth, key: session-key, optional: true }
          resources:
            requests: { memory: 64Mi, cpu: 100m }
            limits: { memory: 160Mi }
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8080 }
          livenessProbe:
            httpGet: { path: /q/health/live, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: befree-backend
  namespace: befree
spec:
  # Reached only through the nginx pod; 30080 on the node now belongs to it
  type: ClusterIP
  selector:
    app: befree-backend
  ports:
    - port: 80
      targetPort: 8080
