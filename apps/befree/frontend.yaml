# nginx serves the built SPA and is the only thing exposed on the node. It
# proxies /api and /webhooks to the backend, so browser and Meta both see one
# origin and the session cookie needs no CORS exception.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: befree-frontend
  namespace: befree
spec:
  replicas: 1
  selector:
    matchLabels:
      app: befree-frontend
  template:
    metadata:
      labels:
        app: befree-frontend
    spec:
      containers:
        - name: nginx
          image: ghcr.io/anddev741/befree-frontend:latest
          ports:
            - containerPort: 8080
          resources:
            requests: { memory: 16Mi, cpu: 20m }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: befree-frontend
  namespace: befree
spec:
  type: NodePort
  selector:
    app: befree-frontend
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
