# nginx serves the built SPA. It
# proxies /api and /webhooks to the backend, so browser and Meta both see one
# origin and the session cookie needs no CORS exception. Traffic arrives only
# through Traefik (apps/befree/ingress.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: befree-frontend
  namespace: befree
spec:
  replicas: 1
  selector:
    matchLabels:
      app: befree-frontend
  template:
    metadata:
      labels:
        app: befree-frontend
    spec:
      containers:
        - name: nginx
          image: ghcr.io/anddev741/befree-frontend:latest@sha256:a52264d2cbe387602f62823921cd3bbcd7206a16657466855b528d713acbc647 # {"$imagepolicy": "befree:befree-frontend"}
          ports:
            - containerPort: 8080
          resources:
            requests: {memory: 16Mi, cpu: 20m}
            limits: {memory: 64Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: befree-frontend
  namespace: befree
spec:
  type: ClusterIP
  selector:
    app: befree-frontend
  ports:
    - port: 80
      targetPort: 8080
