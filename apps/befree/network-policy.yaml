# Same model as beconscient: deny everything, then open only what is used.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: befree
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Only Traefik reaches the page; there is no NodePort any more.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-from-ingress
  namespace: befree
spec:
  podSelector:
    matchLabels: { app: befree-frontend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress }
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-from-frontend
  namespace: befree
spec:
  podSelector:
    matchLabels: { app: befree-backend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: befree-frontend }
      ports:
        - port: 8080
