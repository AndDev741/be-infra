# OmniRoute is reached only through Traefik (omniroute.beyouweb.com, where /v1
# needs an API key). Redis only from OmniRoute.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: omniroute
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omniroute-from-ingress
  namespace: omniroute
spec:
  podSelector:
    matchLabels: { app: omniroute }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress }
      ports:
        - port: 20128
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-omniroute
  namespace: omniroute
spec:
  podSelector:
    matchLabels: { app: omniroute-redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: omniroute }
      ports:
        - port: 6379
