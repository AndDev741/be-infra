# A cache for OmniRoute; it starts empty after a restart, so there is no volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute-redis
  namespace: omniroute
spec:
  replicas: 1
  selector:
    matchLabels: { app: omniroute-redis }
  template:
    metadata:
      labels: { app: omniroute-redis }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
      containers:
        - name: redis
          image: redis:8.6.5-alpine@sha256:cd218f4b106a332c5c992e38a9480bfb9d7e9f8f7b0ec9a0023bfa36d9a408f9
          args: [redis-server, --save, "", --appendonly, "no", --loglevel, warning, --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: omniroute
spec:
  selector: { app: omniroute-redis }
  ports:
    - name: redis
      port: 6379
      targetPort: redis
