# GlitchTip (web + worker in one process) and its Valkey. The database is
# `glitchtip` in the shared Postgres (data/).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: glitchtip
  namespace: glitchtip
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.memory: 1Gi
    pods: "5"
    persistentvolumeclaims: "1"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: glitchtip
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 20m, memory: 32Mi }
      default: { memory: 128Mi }
