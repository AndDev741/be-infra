# GlitchTip takes events and heartbeats from the apps (the browser's go through
# Traefik at mnt.beyouweb.com), and is scraped by Prometheus. Valkey is only
# for GlitchTip. Egress stays open: the uptime monitors probe other namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: glitchtip
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: glitchtip-from-apps
  namespace: glitchtip
spec:
  podSelector:
    matchLabels: { app: glitchtip }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [ingress, beyou, befree, beconscient, monitoring]
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-from-glitchtip
  namespace: glitchtip
spec:
  podSelector:
    matchLabels: { app: glitchtip-valkey }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: glitchtip }
      ports:
        - port: 6379
