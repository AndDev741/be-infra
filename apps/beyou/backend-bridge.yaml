# TEMPORARY, until the backend itself moves into this namespace (phase 3).
#
# Both nginx images proxy /api/v1/ to `http://backend:8099`, the compose service
# name, baked into the image. Here `backend` is a Service in this namespace, so
# the images run unchanged; in phase 3 it becomes a normal Service in front of
# the backend pods and this file goes away.
#
# Until then the backend is still a compose container, published on the host's
# 127.0.0.1:8099 only. A pod cannot reach the host's loopback, and Docker drops
# forwarded traffic to container IPs, so socat on the host network relays from
# the cni0 address (10.42.0.1, the node as seen from pods) to 127.0.0.1:8099.
# The bridge binds that address only, so nothing on the LAN or tailnet can use it.
#
# Every pod in the cluster can reach 10.42.0.1:8099, NetworkPolicy does not
# apply to host-network pods. That is no more than the public api.beyouweb.com
# already allows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-bridge
  namespace: beyou
spec:
  replicas: 1
  # A second copy cannot bind the same address on the same node.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: backend-bridge }
  template:
    metadata:
      labels: { app: backend-bridge }
    spec:
      hostNetwork: true
      automountServiceAccountToken: false
      containers:
        - name: socat
          image: docker.io/alpine/socat:1.8.0.3
          args:
            - TCP-LISTEN:8099,bind=10.42.0.1,fork,reuseaddr
            - TCP:127.0.0.1:8099
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            tcpSocket: { host: 10.42.0.1, port: 8099 }
            periodSeconds: 10
---
# No selector: the endpoint is the bridge's listen address, set by hand below.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: beyou
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8099
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: backend-bridge
  namespace: beyou
  labels:
    kubernetes.io/service-name: backend
    endpointslice.kubernetes.io/managed-by: flux
addressType: IPv4
ports:
  - name: http
    port: 8099
endpoints:
  - addresses: ["10.42.0.1"]
