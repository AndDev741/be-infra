# Traefik (platform/traefik) routes each hostname to its Service. The web app
# calls api.beyouweb.com directly (VITE_API_URL); the nginx pods also proxy
# /api/v1/ to the same `backend` Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beyou
  namespace: beyou
spec:
  ingressClassName: traefik
  rules:
    - host: app.beyouweb.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beyou-frontend
                port: { number: 80 }
    - host: docs.beyouweb.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beyou-docs
                port: { number: 80 }
    - host: api.beyouweb.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port: { number: 8099 }
