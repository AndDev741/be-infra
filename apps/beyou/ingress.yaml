# Traefik (platform/traefik) routes the API hostname to the backend. The web app
# and the docs site live on Cloudflare Workers and call api.beyouweb.com
# directly, so the backend's CORS_ALLOWED_PATTERN lists both origins.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beyou
  namespace: beyou
spec:
  ingressClassName: traefik
  rules:
    - host: api.beyouweb.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port: { number: 8099 }
