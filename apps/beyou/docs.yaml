# The documentation site (docs.beyouweb.com), built by Beyou-docs-ui CI. Its pages
# are prerendered into the image, so a content change ships as a new image.
# nginx proxies /api/v1/ to `backend` (backend.yaml).
#
# Pinned by digest. Flux image automation (images.yaml) commits the new digest
# here when CI pushes a new `latest`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beyou-docs
  namespace: beyou
spec:
  replicas: 1
  selector:
    matchLabels: {app: beyou-docs}
  template:
    metadata:
      labels: {app: beyou-docs}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: ghcr.io/anddev741/beyou-docs:latest@sha256:413cfb8f2bcf31de96b9e02bc61f25a31f3a6dce2ab7f57e477a5d5bd93b6938 # {"$imagepolicy": "beyou:beyou-docs"}
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: beyou-docs
  namespace: beyou
spec:
  type: ClusterIP
  selector: {app: beyou-docs}
  ports:
    - port: 80
