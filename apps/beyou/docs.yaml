# The documentation site (docs.beyouweb.com), built by Beyou-docs-ui CI. Its pages
# are prerendered into the image, so a content change ships as a new image.
# nginx proxies /api/v1/ to `backend` (see backend-bridge.yaml).
#
# Pinned by digest: a new build goes out by committing its digest here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beyou-docs
  namespace: beyou
spec:
  replicas: 1
  selector:
    matchLabels: { app: beyou-docs }
  template:
    metadata:
      labels: { app: beyou-docs }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: ghcr.io/anddev741/beyou-docs@sha256:42b261dd8dae095a8c3ea45022ba67a380b5178eb18f8b035278397c2cf50fb0
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: beyou-docs
  namespace: beyou
spec:
  type: ClusterIP
  selector: { app: beyou-docs }
  ports:
    - port: 80
