# The web app (app.beyouweb.com), built by Beyou-Frontend CI. nginx serves the
# SPA and proxies /api/v1/ to `backend` (backend.yaml).
#
# Pinned by digest. Flux image automation (images.yaml) commits the new digest
# here when CI pushes a new `latest`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beyou-frontend
  namespace: beyou
spec:
  replicas: 1
  selector:
    matchLabels: {app: beyou-frontend}
  template:
    metadata:
      labels: {app: beyou-frontend}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: ghcr.io/anddev741/beyou-web:latest@sha256:40f8710b01008b868ec0c61af5303f74da964eadd5be8724e478dfcd1c6f5faa # {"$imagepolicy": "beyou:beyou-web"}
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: beyou-frontend
  namespace: beyou
spec:
  type: ClusterIP
  selector: {app: beyou-frontend}
  ports:
    - port: 80
