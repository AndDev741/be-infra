# The web app (app.beyouweb.com), built by Beyou-Frontend CI. nginx serves the
# SPA and proxies /api/v1/ to `backend` (backend.yaml).
#
# Pinned by digest. Flux image automation (images.yaml) commits the new digest
# here when CI pushes a new `latest`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beyou-frontend
  namespace: beyou
spec:
  replicas: 1
  selector:
    matchLabels: { app: beyou-frontend }
  template:
    metadata:
      labels: { app: beyou-frontend }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: ghcr.io/anddev741/beyou-web:latest@sha256:6aaf059870d8a7ecd6637b6749ca258a63b4ab022a180dc6e0265b69796d777d # {"$imagepolicy": "beyou:beyou-web"}
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: beyou-frontend
  namespace: beyou
spec:
  type: ClusterIP
  selector: { app: beyou-frontend }
  ports:
    - port: 80
