# The Spring Boot API (api.beyouweb.com, and /api/v1/ behind both nginx).
# Its configuration is secrets/beyou-backend.sops.yaml; the database is the
# shared Postgres (data/), the uploads a volume of their own.
#
# One replica, and Recreate rather than a rolling update: the uploads volume can
# be mounted by one pod only, and the three @Scheduled jobs must not run twice.
# Both have to change before replicas (phase 5).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beyou-uploads
  namespace: beyou
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beyou-backend
  namespace: beyou
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: beyou-backend}
  template:
    metadata:
      labels: {app: beyou-backend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
      containers:
        - name: backend
          image: ghcr.io/anddev741/beyou-backend:latest@sha256:93db5d669fd34d08fa72bb4bcec628c05c3b5064cc5a2f40e17a82b11f04745b # {"$imagepolicy": "beyou:beyou-backend"}
          envFrom:
            - secretRef:
                name: beyou-backend
          env:
            - {name: DATABASE_URL, value: "jdbc:postgresql://pg-rw.data.svc:5432/beyou"}
            - {name: DATABASE_USERNAME, value: beyou}
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://pg-rw.data.svc:5432/beyou"}
            - {name: SPRING_DATASOURCE_USERNAME, value: beyou}
            - {name: UPLOAD_DIR, value: /data/uploads}
            - {name: MANAGEMENT_PORT, value: "9091"}
            - {name: MANAGEMENT_ADDRESS, value: 0.0.0.0}
            # Memory budget, measured 2026-10-14 at ~980Mi RSS: heap ~320Mi in
            # use for a live set of 80-120Mi, metaspace ~200Mi (33k classes),
            # code cache ~45Mi, and ~420Mi of native memory the JVM does not
            # account for at all.
            #
            # glibc hands each thread its own malloc arena (up to 8 per core),
            # and in a container that is the usual home of untracked RSS; two
            # arenas are plenty at this traffic.
            - {name: MALLOC_ARENA_MAX, value: "2"}
            # The heap is sized from the live set (3x its peak), not from the
            # limit. G1 is named explicitly because under 1792M the JVM picks
            # SerialGC, whose old generation is only emptied by a full GC:
            # objects promoted by each notebook AI call piled up to ~430Mi over
            # a ~100Mi live set. G1 marks the old generation concurrently, and
            # the periodic cycle (every 5 minutes without a GC) hands memory
            # back while idle. C1 only (TieredStopAtLevel=1) trades some peak
            # throughput for a smaller code cache and far less compiler memory.
            # Native memory tracking costs a few MB and lets
            # `jcmd 1 VM.native_memory summary` explain the rest.
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Xms64m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -XX:G1PeriodicGCInterval=300000 -XX:ReservedCodeCacheSize=64m -XX:TieredStopAtLevel=1 -XX:NativeMemoryTracking=summary
          ports:
            - {name: http, containerPort: 8099}
            - {name: metrics, containerPort: 9091}
          resources:
            requests: {cpu: 200m, memory: 896Mi}
            limits: {memory: 1280Mi}
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          # Spring Boot exposes the liveness and readiness groups on its own
          # when it detects Kubernetes; readiness includes the database.
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: metrics}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: metrics}
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: metrics}
            periodSeconds: 10
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: beyou-uploads
---
# `backend` is the upstream name baked into both nginx images, and Traefik's
# target for api.beyouweb.com.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: beyou
  labels: {app: beyou-backend}
spec:
  type: ClusterIP
  selector: {app: beyou-backend}
  ports:
    - {name: http, port: 8099}
    - {name: metrics, port: 9091}
---
# The job is named after the Service's `app` label, `beyou-backend`, the name
# the beyou dashboards already query.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: beyou-backend
  namespace: beyou
spec:
  jobLabel: app
  selector:
    matchLabels: {app: beyou-backend}
  endpoints:
    - port: metrics
      path: /actuator/prometheus
      interval: 30s
