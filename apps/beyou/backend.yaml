# The Spring Boot API (api.beyouweb.com, and /api/v1/ behind both nginx).
# Its configuration is secrets/beyou-backend.sops.yaml; the database is the
# shared Postgres (data/), the uploads a volume of their own.
#
# One replica, and Recreate rather than a rolling update: the uploads volume can
# be mounted by one pod only, and the three @Scheduled jobs must not run twice.
# Both have to change before replicas (phase 5).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beyou-uploads
  namespace: beyou
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beyou-backend
  namespace: beyou
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: beyou-backend }
  template:
    metadata:
      labels: { app: beyou-backend }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
      containers:
        - name: backend
          image: ghcr.io/anddev741/beyou-backend:latest@sha256:43ea5bb137301d4af68d0216a83861132f7b1864dfa88fd5b364a62a0c978ff9 # {"$imagepolicy": "beyou:beyou-backend"}
          envFrom:
            - secretRef:
                name: beyou-backend
          env:
            - { name: DATABASE_URL, value: "jdbc:postgresql://pg-rw.data.svc:5432/beyou" }
            - { name: DATABASE_USERNAME, value: beyou }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://pg-rw.data.svc:5432/beyou" }
            - { name: SPRING_DATASOURCE_USERNAME, value: beyou }
            - { name: UPLOAD_DIR, value: /data/uploads }
            - { name: MANAGEMENT_PORT, value: "9091" }
            - { name: MANAGEMENT_ADDRESS, value: 0.0.0.0 }
            # The heap follows the container limit (55% of it, ~700Mi), and
            # metaspace is capped so it cannot grow into the limit unnoticed.
            # Non-heap (metaspace, code cache, threads) takes ~260Mi on top: at
            # 70% of 1Gi the process sat at ~980Mi RSS, a step from an OOM kill.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=55 -XX:MaxMetaspaceSize=256m
          ports:
            - { name: http, containerPort: 8099 }
            - { name: metrics, containerPort: 9091 }
          resources:
            requests: { cpu: 200m, memory: 896Mi }
            limits: { memory: 1280Mi }
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          # Spring Boot exposes the liveness and readiness groups on its own
          # when it detects Kubernetes; readiness includes the database.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: metrics }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: metrics }
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: metrics }
            periodSeconds: 10
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: beyou-uploads
---
# `backend` is the upstream name baked into both nginx images, and Traefik's
# target for api.beyouweb.com.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: beyou
  labels: { app: beyou-backend }
spec:
  type: ClusterIP
  selector: { app: beyou-backend }
  ports:
    - { name: http, port: 8099 }
    - { name: metrics, port: 9091 }
---
# The job is named after the Service's `app` label, `beyou-backend`, the name
# the beyou dashboards already query.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: beyou-backend
  namespace: beyou
spec:
  jobLabel: app
  selector:
    matchLabels: { app: beyou-backend }
  endpoints:
    - port: metrics
      path: /actuator/prometheus
      interval: 30s
