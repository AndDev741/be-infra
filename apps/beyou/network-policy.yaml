# The backend is reachable only from Traefik (api.beyouweb.com), which is where
# the tunnel connects, and from Prometheus. GlitchTip's uptime monitors may probe
# its health port. Everything else in the cluster is refused.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: beyou
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-from-ingress
  namespace: beyou
spec:
  podSelector:
    matchLabels: { app: beyou-backend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress }
      ports:
        - port: 8099
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-metrics-from-monitoring
  namespace: beyou
spec:
  podSelector:
    matchLabels: { app: beyou-backend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: glitchtip }
      ports:
        - port: 9091
