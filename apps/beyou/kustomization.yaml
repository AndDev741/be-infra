# The main app: web app, docs site, backend (database in data/). Errors and
# heartbeats go to GlitchTip (apps/glitchtip) through the alias in glitchtip.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - limits.yaml
  - network-policy.yaml
  - secrets/beyou-backend.sops.yaml
  - secrets/beyou-backup.sops.yaml
  - glitchtip.yaml
  - backend.yaml
  - frontend.yaml
  - docs.yaml
  - ingress.yaml
  - images.yaml
  - backup.yaml
