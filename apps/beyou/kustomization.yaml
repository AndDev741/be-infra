# The main app's backend (database in data/). The web app and the docs site are
# static files on Cloudflare Workers, deployed by Beyou-Frontend and
# Beyou-docs-ui CI. Errors and heartbeats go to GlitchTip (apps/glitchtip)
# through the alias in glitchtip.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - limits.yaml
  - network-policy.yaml
  - secrets/beyou-backend.sops.yaml
  - secrets/beyou-backup.sops.yaml
  - glitchtip.yaml
  - backend.yaml
  - ingress.yaml
  - images.yaml
  - backup.yaml
