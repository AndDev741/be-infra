# Continuous deployment: beConscient's CI pushes `latest` to GHCR, Flux commits
# the new digest to backend.yaml / frontend.yaml (the `$imagepolicy` markers)
# and the beconscient Kustomization rolls it out. Same setup as apps/beyou.
#   flux suspend image update beconscient    # hold deploys back
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: beconscient-backend
  namespace: beconscient
spec:
  image: ghcr.io/anddev741/beconscient-backend
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: beconscient-backend
  namespace: beconscient
spec:
  imageRepositoryRef: { name: beconscient-backend }
  filterTags: { pattern: '^latest$' }
  policy:
    alphabetical: { order: asc }
  digestReflectionPolicy: Always
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: beconscient-frontend
  namespace: beconscient
spec:
  image: ghcr.io/anddev741/beconscient-frontend
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: beconscient-frontend
  namespace: beconscient
spec:
  imageRepositoryRef: { name: beconscient-frontend }
  filterTags: { pattern: '^latest$' }
  policy:
    alphabetical: { order: asc }
  digestReflectionPolicy: Always
  interval: 5m
---
# Writes the policies above into this app's directory only, and pushes to main.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: beconscient
  namespace: beconscient
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref: { branch: main }
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |-
        Deploy new beconscient images

        {{ range .Changed.Changes -}}
        - {{ .OldValue }} -> {{ .NewValue }}
        {{ end -}}
    push:
      branch: main
  update:
    path: ./apps/beconscient
    strategy: Setters

