# Traefik (platform/traefik) routes this hostname to the app's nginx, which
# serves the page and proxies the API itself, exactly as the NodePort did.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beconscient
  namespace: beconscient
spec:
  ingressClassName: traefik
  rules:
    - host: beconscient.beyouweb.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beconscient-frontend
                port: { number: 80 }
