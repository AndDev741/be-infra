# The page, served by nginx, which also proxies /api/ and /ingest/ to the
# backend. It is reached only through Traefik (ingress.yaml), behind the
# Cloudflare Tunnel that terminates TLS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beconscient-frontend
  namespace: beconscient
spec:
  replicas: 1
  selector:
    matchLabels: { app: beconscient-frontend }
  template:
    metadata:
      labels: { app: beconscient-frontend }
    spec:
      containers:
        - name: nginx
          image: ghcr.io/anddev741/beconscient-frontend:latest@sha256:ddb35e926e0ef03f16bd936df8db414481c9d2767b875660b3f166402ed1b57f # {"$imagepolicy": "beconscient:beconscient-frontend"}
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: beconscient-frontend
  namespace: beconscient
spec:
  type: ClusterIP
  selector: { app: beconscient-frontend }
  ports:
    - port: 80
      targetPort: 8080
