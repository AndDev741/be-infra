# The page, served by nginx, which also proxies /api/ and /ingest/ to the
# backend. It is reached only through Traefik (ingress.yaml), behind the
# Cloudflare Tunnel that terminates TLS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beconscient-frontend
  namespace: beconscient
spec:
  replicas: 1
  selector:
    matchLabels: {app: beconscient-frontend}
  template:
    metadata:
      labels: {app: beconscient-frontend}
    spec:
      containers:
        - name: nginx
          image: ghcr.io/anddev741/beconscient-frontend:latest@sha256:4b2d46e714532bbadfc67e0fe5dd88e76b7b4d6f27fa5dde72ae067f39363bf2 # {"$imagepolicy": "beconscient:beconscient-frontend"}
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {memory: 64Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: beconscient-frontend
  namespace: beconscient
spec:
  type: ClusterIP
  selector: {app: beconscient-frontend}
  ports:
    - port: 80
      targetPort: 8080
