# Originals live on the 500 GB HDD mounted at /srv/media (LABEL=media in the
# host's fstab), everything Immich can rebuild lives on the SSD.
#
# The library is a static volume with Retain: deleting the claim, the
# namespace or this Kustomization never deletes a photo. The directory must
# exist before the first start, owned by the uid Immich runs as:
#   sudo install -d -o 1000 -g 1000 /srv/media/immich
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library
  labels:
    be-infra/app: immich
spec:
  capacity:
    storage: 400Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  # No StorageClass object by this name exists; it only pairs this volume
  # with its claim so local-path never provisions one instead.
  storageClassName: media-hdd
  volumeMode: Filesystem
  local:
    path: /srv/media/immich
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [beyou-server]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: media-hdd
  volumeName: immich-library
  resources:
    requests:
      storage: 400Gi
---
# Thumbnails and previews, mounted over the library's thumbs/ folder so the
# grid never waits on the spinning disk. Regenerated by Immich if lost, so the
# backup skips them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-thumbs
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
# Machine-learning models, downloaded on first use (about 1 GB).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
