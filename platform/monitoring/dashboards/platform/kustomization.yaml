apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Platform
configMapGenerator:
  - name: dashboards-platform
    files:
      - node-exporter-full.json
      - traefik.json
