apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: beyou
configMapGenerator:
  - name: dashboards-beyou
    files:
      - beyou-ai-agent.json
      - beyou-logs.json
      - beyou-product.json
      - beyou-service-health.json
