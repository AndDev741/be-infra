# Budget for the whole observability stack. Expected use: Prometheus ~300Mi,
# Grafana ~150Mi, Loki ~200Mi, Alloy ~150Mi, the rest under 100Mi together.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring
  namespace: monitoring
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 1536Mi
    limits.memory: 3Gi
    persistentvolumeclaims: "4"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: monitoring
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 20m, memory: 32Mi }
      default: { memory: 128Mi }
