# Scrape targets for the platform pieces that live outside this namespace.
# App-owned monitors go in the app's own directory under apps/.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: traefik
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [ingress]
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  podMetricsEndpoints:
    - port: metrics
---
# The controllers' metrics port; flux-system's own allow-scraping policy lets
# any namespace reach it.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [flux-system]
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [helm-controller, kustomize-controller, notification-controller, source-controller]
  podMetricsEndpoints:
    - port: http-prom
      # Reconcile and workqueue latency histograms; nothing here reads them.
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: (gotk_reconcile_duration_seconds|controller_runtime_reconcile_time_seconds|workqueue_queue_duration_seconds|workqueue_work_duration_seconds|go_gc_.*)_bucket
