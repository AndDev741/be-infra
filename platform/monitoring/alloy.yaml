# One collector on the node for the logs of every pod (files under
# /var/log/pods), shipped to Loki. Metrics are scraped by Prometheus directly.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 24h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  # Its ServiceMonitor needs the CRDs that kube-prometheus-stack installs.
  dependsOn:
    - name: kube-prometheus-stack
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: 1.13.1
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    controller:
      type: daemonset
    serviceMonitor:
      enabled: true
    alloy:
      # GlitchTip's uptime monitor and the monitoring NetworkPolicy use this port.
      listenPort: 12350
      mounts:
        varlog: true
      resources:
        requests: { cpu: 50m, memory: 96Mi }
        limits: { memory: 384Mi }
      configMap:
        content: |
          // ---------- Kubernetes: pod logs ----------
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              regex         = "(.+)"
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "job"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$1/*.log"
            }
          }

          local.file_match "pod_logs" {
            path_targets = discovery.relabel.pod_logs.output
          }

          loki.source.file "pod_logs" {
            targets    = local.file_match.pod_logs.targets
            forward_to = [loki.process.pod_logs.receiver]
          }

          loki.process "pod_logs" {
            stage.cri {}
            forward_to = [loki.write.local.receiver]
          }

          // ---------- Outputs ----------
          loki.write "local" {
            endpoint {
              url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
            }
          }
