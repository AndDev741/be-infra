# Metrics for everything on the node: the host (node-exporter), every pod and
# container (kubelet/cAdvisor), the cluster's own state (kube-state-metrics),
# plus Grafana. Each app can add its own ServiceMonitor/PodMonitor in its own
# namespace; Prometheus picks up all of them.
#
# Alertmanager is off: alerts are Grafana-managed and go out by email.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: kps
    cleanPrometheusOperatorObjectNames: true

    alertmanager:
      enabled: false

    # k3s runs etcd (sqlite here), the scheduler, the controller manager and
    # kube-proxy inside the k3s process, not as scrapeable pods; left on, they
    # only show up as permanently down targets and firing alerts.
    kubeEtcd: { enabled: false }
    kubeControllerManager: { enabled: false }
    kubeScheduler: { enabled: false }
    kubeProxy: { enabled: false }
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false

    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 8GB
        scrapeInterval: 30s
        # Alloy pushes what it scrapes on the Docker side (the beyou stack still
        # in compose) through remote write.
        enableRemoteWriteReceiver: true
        # Select monitors and rules from every namespace, not only this release's.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        resources:
          requests: { cpu: 100m, memory: 384Mi }
          limits: { memory: 1Gi }
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 10Gi

    prometheusOperator:
      resources:
        requests: { cpu: 20m, memory: 48Mi }
        limits: { memory: 128Mi }
      prometheusConfigReloader:
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 64Mi }

    kube-state-metrics:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }

    prometheus-node-exporter:
      resources:
        requests: { cpu: 10m, memory: 24Mi }
        limits: { memory: 64Mi }

    grafana:
      fullnameOverride: grafana
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: local-path
        size: 1Gi
      resources:
        requests: { cpu: 20m, memory: 128Mi }
        limits: { memory: 384Mi }
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts: [obs.beyouweb.com]
        path: /
      grafana.ini:
        server:
          root_url: https://obs.beyouweb.com
        users:
          allow_sign_up: false
        analytics:
          reporting_enabled: false
          check_for_updates: false
      additionalDataSources:
        - name: Loki
          uid: loki
          type: loki
          url: http://loki.monitoring.svc:3100
          access: proxy
      sidecar:
        dashboards:
          # Dashboards are ConfigMaps labelled grafana_dashboard=1 in any
          # namespace; the folder annotation groups them per app.
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
