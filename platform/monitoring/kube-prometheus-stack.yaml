# Metrics for everything on the node: the host (node-exporter), every pod and
# container (kubelet/cAdvisor), the cluster's own state (kube-state-metrics),
# plus Grafana. Each app can add its own ServiceMonitor/PodMonitor in its own
# namespace; Prometheus picks up all of them.
#
# Alertmanager is off: alerts are Grafana-managed (grafana.alerting below)
# and go out by email.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: kps
    cleanPrometheusOperatorObjectNames: true

    alertmanager:
      enabled: false

    # k3s runs etcd (sqlite here), the scheduler, the controller manager and
    # kube-proxy inside the k3s process, not as scrapeable pods; left on, they
    # only show up as permanently down targets and firing alerts.
    kubeEtcd: { enabled: false }
    kubeControllerManager: { enabled: false }
    kubeScheduler: { enabled: false }
    kubeProxy: { enabled: false }
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false

    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 8GB
        scrapeInterval: 30s
        # Alloy pushes what it scrapes on the Docker side (the beyou stack still
        # in compose) through remote write.
        enableRemoteWriteReceiver: true
        # Select monitors and rules from every namespace, not only this release's.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        resources:
          requests: { cpu: 100m, memory: 384Mi }
          limits: { memory: 1Gi }
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 10Gi

    prometheusOperator:
      resources:
        requests: { cpu: 20m, memory: 48Mi }
        limits: { memory: 128Mi }
      prometheusConfigReloader:
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 64Mi }

    kube-state-metrics:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }

    prometheus-node-exporter:
      resources:
        requests: { cpu: 10m, memory: 24Mi }
        limits: { memory: 64Mi }

    grafana:
      fullnameOverride: grafana
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: local-path
        size: 1Gi
      # 384Mi got OOMKilled (Grafana 13 sits at ~400Mi with a few dashboards open).
      # GOMEMLIMIT makes the Go GC work harder before the cgroup limit is hit.
      resources:
        requests: { cpu: 50m, memory: 320Mi }
        limits: { memory: 768Mi }
      env:
        GOMEMLIMIT: 640MiB
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts: [obs.beyouweb.com]
        path: /
      grafana.ini:
        server:
          root_url: https://obs.beyouweb.com
        users:
          allow_sign_up: false
        analytics:
          reporting_enabled: false
          check_for_updates: false
      # Mail goes out through the same Gmail SMTP GlitchTip uses (secret
      # grafana-smtp). ALERT_EMAIL comes from that secret too, so the address
      # is not in this public repo; Grafana expands $VARS in provisioning files.
      envFromSecrets:
        - name: grafana-smtp
        - name: grafana-beyou-db
      alerting:
        contactpoints.yaml:
          apiVersion: 1
          contactPoints:
            - orgId: 1
              name: email
              receivers:
                - uid: email
                  type: email
                  settings:
                    addresses: $ALERT_EMAIL
                    singleEmail: true
        policies.yaml:
          apiVersion: 1
          policies:
            - orgId: 1
              receiver: email
              group_by: [alertname, namespace]
              group_wait: 1m
              group_interval: 10m
              repeat_interval: 12h
        rules.yaml:
          apiVersion: 1
          groups:
            - orgId: 1
              name: host
              folder: Alerts
              interval: 1m
              rules:
              - uid: host-memory
                title: Host memory almost full
                condition: C
                for: 10m
                noDataState: OK
                execErrState: Error
                annotations:
                  summary: "Less than 10% of RAM available for 10 minutes"
                data:
                  - refId: A
                    relativeTimeRange: { from: 600, to: 0 }
                    datasourceUid: prometheus
                    model:
                      refId: A
                      instant: true
                      expr: '1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes'
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator: { type: gt, params: [0.9] }
              - uid: host-swap
                title: Host swapping heavily
                condition: C
                for: 30m
                noDataState: OK
                execErrState: Error
                annotations:
                  summary: "More than half of the swap in use for 30 minutes"
                data:
                  - refId: A
                    relativeTimeRange: { from: 600, to: 0 }
                    datasourceUid: prometheus
                    model:
                      refId: A
                      instant: true
                      expr: '1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes'
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator: { type: gt, params: [0.5] }
              - uid: host-disk
                title: Root disk almost full
                condition: C
                for: 15m
                noDataState: OK
                execErrState: Error
                annotations:
                  summary: "Root filesystem above 85% for 15 minutes"
                data:
                  - refId: A
                    relativeTimeRange: { from: 600, to: 0 }
                    datasourceUid: prometheus
                    model:
                      refId: A
                      instant: true
                      expr: '1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}'
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator: { type: gt, params: [0.85] }
            - orgId: 1
              name: workloads
              folder: Alerts
              interval: 1m
              rules:
              - uid: pod-restarting
                title: Container restarting
                condition: C
                for: 0m
                noDataState: OK
                execErrState: Error
                annotations:
                  summary: "A container restarted more than twice in 15 minutes"
                data:
                  - refId: A
                    relativeTimeRange: { from: 900, to: 0 }
                    datasourceUid: prometheus
                    model:
                      refId: A
                      instant: true
                      expr: 'sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[15m]))'
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator: { type: gt, params: [2] }
              - uid: pod-not-running
                title: Pod stuck
                condition: C
                for: 10m
                noDataState: OK
                execErrState: Error
                annotations:
                  summary: "A pod has been Pending, Failed or Unknown for 10 minutes"
                data:
                  - refId: A
                    relativeTimeRange: { from: 600, to: 0 }
                    datasourceUid: prometheus
                    model:
                      refId: A
                      instant: true
                      expr: 'sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Failed|Unknown"})'
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator: { type: gt, params: [0] }
              - uid: deployment-unavailable
                title: Deployment missing replicas
                condition: C
                for: 10m
                noDataState: OK
                execErrState: Error
                annotations:
                  summary: "A Deployment has had unavailable replicas for 10 minutes"
                data:
                  - refId: A
                    relativeTimeRange: { from: 600, to: 0 }
                    datasourceUid: prometheus
                    model:
                      refId: A
                      instant: true
                      expr: 'sum by (namespace, deployment) (kube_deployment_status_replicas_unavailable)'
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator: { type: gt, params: [0] }
              - uid: target-down
                title: Scrape target down
                condition: C
                for: 5m
                noDataState: OK
                execErrState: Error
                annotations:
                  summary: "A metrics endpoint has not answered for 5 minutes (labels say which)"
                data:
                  - refId: A
                    relativeTimeRange: { from: 600, to: 0 }
                    datasourceUid: prometheus
                    model:
                      refId: A
                      instant: true
                      expr: 'up'
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator: { type: lt, params: [1] }
      additionalDataSources:
        - name: Loki
          uid: loki
          type: loki
          url: http://loki.monitoring.svc:3100
          access: proxy
        # The beyou database, read-only, for the product dashboard. The role can
        # only SELECT, and only in that database (data/postgres.yaml).
        - name: Beyou Postgres
          uid: beyou-postgres
          type: grafana-postgresql-datasource
          url: pg-rw.data.svc:5432
          user: beyou_readonly
          access: proxy
          editable: false
          jsonData:
            database: beyou
            sslmode: require
            postgresVersion: 1700
            maxOpenConns: 2
            maxIdleConns: 1
          secureJsonData:
            password: $BEYOU_DB_PASSWORD
      sidecar:
        dashboards:
          # Dashboards are ConfigMaps labelled grafana_dashboard=1 in any
          # namespace; the folder annotation groups them per app.
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
