# Metrics for everything on the node: the host (node-exporter), every pod and
# container (kubelet/cAdvisor), the cluster's own state (kube-state-metrics),
# plus Grafana. Each app can add its own ServiceMonitor/PodMonitor in its own
# namespace; Prometheus picks up all of them.
#
# Alertmanager is off: alerts are Grafana-managed (grafana.alerting below)
# and go out by email.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: kps
    cleanPrometheusOperatorObjectNames: true

    alertmanager:
      enabled: false

    # k3s runs etcd (sqlite here), the scheduler, the controller manager and
    # kube-proxy inside the k3s process, not as scrapeable pods; left on, they
    # only show up as permanently down targets and firing alerts.
    kubeEtcd: { enabled: false }
    kubeControllerManager: { enabled: false }
    kubeScheduler: { enabled: false }
    kubeProxy: { enabled: false }
    # k3s is one binary, so the kubelet's /metrics also carries the API server's,
    # etcd's and the workqueues' metrics: ~38k series duplicating the apiserver
    # job. Keep only what is the kubelet's own (the default rules and the Kubelet
    # dashboard use these).
    kubelet:
      serviceMonitor:
        metricRelabelings:
          - action: keep
            sourceLabels: [__name__]
            regex: (kubelet_.*|storage_operation_.*|volume_manager_.*|prober_probe_total|process_.*|rest_client_requests_total)
          # Latency histograms of the kubelet's own operations; no dashboard
          # or alert here reads them.
          - action: drop
            sourceLabels: [__name__]
            regex: (kubelet_.*|storage_operation_.*)_bucket
        # cAdvisor: an allowlist instead of the chart's drop list (this setting
        # replaces it). Kept: CPU, throttling, memory, OOMs, network and disk
        # bytes per container; enough for per-app resource panels.
        cAdvisorMetricRelabelings:
          - action: keep
            sourceLabels: [__name__]
            regex: container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|memory_working_set_bytes|memory_rss|memory_cache|oom_events_total|network_(receive|transmit)_bytes_total|fs_(reads|writes)_bytes_total)
          # From the chart's defaults: CNI interfaces, and cgroups with no pod,
          # except k3s.service (API server, kubelet, containerd: ~1.8Gi that
          # the server overview shows apart from the rest of the host).
          - action: drop
            sourceLabels: [__name__, interface]
            regex: container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl|flannel|veth).*
          - action: replace
            sourceLabels: [id]
            regex: /system\.slice/k3s\.service
            targetLabel: __tmp_keep
            replacement: "1"
          - action: drop
            sourceLabels: [__tmp_keep, id, pod]
            regex: ;.+;
          - action: labeldrop
            regex: __tmp_keep
        # Probe latency per container, in buckets; prober_probe_total covers
        # whether the probes pass.
        probesMetricRelabelings:
          - action: drop
            sourceLabels: [__name__]
            regex: prober_probe_duration_seconds_bucket
    # The API server's job also carries the whole k3s binary (scheduler,
    # kubelet, kine), ~30k series before any trim. Nothing here reads its
    # histograms or the SLO/burn-rate rules built on them (the default rules
    # are off below), so keep only request counts, in-flight requests and the
    # process metrics: enough for a control-plane panel later.
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          - action: keep
            sourceLabels: [__name__]
            regex: (apiserver_request_total|apiserver_current_inflight_requests|process_.*)
    # The chart's ~220 default rules: its alerting rules fire nowhere (there
    # is no Alertmanager; the alerts that email are Grafana's, below), and its
    # recording rules only feed the chart's dashboards, which are off too.
    defaultRules:
      create: false

    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 8GB
        # 60s halves the samples kept in memory; every dashboard and rule here
        # uses windows of 5m or more.
        scrapeInterval: 60s
        evaluationInterval: 60s
        # Select monitors and rules from every namespace, not only this release's.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        # Prometheus 3 sets GOMEMLIMIT to 90% of the limit and keeps freed
        # memory up to it: at 1Gi it sat at ~510Mi with a 240Mi heap. With the
        # trimmed scrapes and no default rules (~20k series) 384Mi leaves room
        # for compactions.
        resources:
          requests: { cpu: 100m, memory: 192Mi }
          limits: { memory: 384Mi }
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 10Gi

    prometheusOperator:
      resources:
        requests: { cpu: 20m, memory: 48Mi }
        limits: { memory: 128Mi }
      prometheusConfigReloader:
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 64Mi }

    kube-state-metrics:
      # Only the objects the alerts and dashboards read. Left out: secrets,
      # configmaps, endpoints, replicasets (one per old Deployment revision),
      # network policies, leases, webhooks and the like.
      collectors:
        - cronjobs
        - daemonsets
        - deployments
        - jobs
        - namespaces
        - nodes
        - persistentvolumeclaims
        - persistentvolumes
        - pods
        - resourcequotas
        - services
        - statefulsets
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }

    prometheus-node-exporter:
      resources:
        requests: { cpu: 10m, memory: 24Mi }
        limits: { memory: 64Mi }

    grafana:
      fullnameOverride: grafana
      # The chart's ~25 Kubernetes dashboards. The ones in use are this repo's
      # (dashboards/ and apps/*), provisioned through the sidecar.
      defaultDashboardsEnabled: false
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: local-path
        size: 1Gi
      # Grafana 13 starts a process for every bundled backend datasource plugin,
      # used or not (~20-40Mi each). Only Prometheus, Loki and Postgres are used
      # here; the rest are disabled in grafana.ini below. GOMEMLIMIT makes the Go
      # GC work harder before the cgroup limit is hit.
      resources:
        requests: { cpu: 50m, memory: 256Mi }
        limits: { memory: 512Mi }
      env:
        GOMEMLIMIT: 384MiB
      # Grafana's own metrics (~3k series) are not read by anything here;
      # GlitchTip's uptime monitor covers its health.
      serviceMonitor:
        enabled: false
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts: [obs.beyouweb.com]
        path: /
      grafana.ini:
        server:
          root_url: https://obs.beyouweb.com
        users:
          allow_sign_up: false
        analytics:
          reporting_enabled: false
          check_for_updates: false
          check_for_plugin_updates: false
        plugins:
          # Nothing here uses these, and each backend one is a running process.
          disable_plugins: grafana-azure-monitor-datasource,cloudwatch,elasticsearch,stackdriver,grafana-pyroscope-datasource,graphite,influxdb,jaeger,mssql,mysql,opentsdb,tempo,grafana-testdata-datasource,zipkin,alertmanager,grafana-pyroscope-app,grafana-exploretraces-app,grafana-advisor-app
          preinstall_disabled: true
        news:
          news_feed_enabled: false
      # Mail goes out through the same Gmail SMTP GlitchTip uses (secret
      # grafana-smtp). ALERT_EMAIL comes from that secret too, so the address
      # is not in this public repo; Grafana expands $VARS in provisioning files.
      envFromSecrets:
        - name: grafana-smtp
        - name: grafana-beyou-db
        - name: grafana-immich-db
      alerting:
        contactpoints.yaml:
          apiVersion: 1
          contactPoints:
            - orgId: 1
              name: email
              receivers:
                - uid: email
                  type: email
                  settings:
                    addresses: $ALERT_EMAIL
                    singleEmail: true
        policies.yaml:
          apiVersion: 1
          policies:
            - orgId: 1
              receiver: email
              group_by: [alertname, namespace]
              group_wait: 1m
              group_interval: 10m
              repeat_interval: 12h
        rules.yaml:
          apiVersion: 1
          groups:
            - orgId: 1
              name: host
              folder: Alerts
              interval: 1m
              rules:
              - uid: host-memory
                title: Host memory almost full
                condition: C
                for: 10m
                noDataState: OK
                execErrState: Error
                annotations:
                  summary: "Less than 10% of RAM available for 10 minutes"
                data:
                  - refId: A
                    relativeTimeRange: { from: 600, to: 0 }
                    datasourceUid: prometheus
                    model:
                      refId: A
                      instant: true
                      expr: '1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes'
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator: { type: gt, params: [0.9] }
              - uid: host-swap
                title: Host swapping heavily
                condition: C
                for: 30m
                noDataState: OK
                execErrState: Error
                annotations:
                  summary: "More than half of the swap in use for 30 minutes"
                data:
                  - refId: A
                    relativeTimeRange: { from: 600, to: 0 }
                    datasourceUid: prometheus
                    model:
                      refId: A
                      instant: true
                      expr: '1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes'
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator: { type: gt, params: [0.5] }
              - uid: host-disk
                title: Root disk almost full
                condition: C
                for: 15m
                noDataState: OK
                execErrState: Error
                annotations:
                  summary: "Root filesystem above 85% for 15 minutes"
                data:
                  - refId: A
                    relativeTimeRange: { from: 600, to: 0 }
                    datasourceUid: prometheus
                    model:
                      refId: A
                      instant: true
                      expr: '1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}'
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator: { type: gt, params: [0.85] }
            - orgId: 1
              name: workloads
              folder: Alerts
              interval: 1m
              rules:
              - uid: pod-restarting
                title: Container restarting
                condition: C
                for: 0m
                noDataState: OK
                execErrState: Error
                annotations:
                  summary: "A container restarted more than twice in 15 minutes"
                data:
                  - refId: A
                    relativeTimeRange: { from: 900, to: 0 }
                    datasourceUid: prometheus
                    model:
                      refId: A
                      instant: true
                      expr: 'sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[15m]))'
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator: { type: gt, params: [2] }
              - uid: pod-not-running
                title: Pod stuck
                condition: C
                for: 10m
                noDataState: OK
                execErrState: Error
                annotations:
                  summary: "A pod has been Pending, Failed or Unknown for 10 minutes"
                data:
                  - refId: A
                    relativeTimeRange: { from: 600, to: 0 }
                    datasourceUid: prometheus
                    model:
                      refId: A
                      instant: true
                      expr: 'sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Failed|Unknown"})'
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator: { type: gt, params: [0] }
              - uid: deployment-unavailable
                title: Deployment missing replicas
                condition: C
                for: 10m
                noDataState: OK
                execErrState: Error
                annotations:
                  summary: "A Deployment has had unavailable replicas for 10 minutes"
                data:
                  - refId: A
                    relativeTimeRange: { from: 600, to: 0 }
                    datasourceUid: prometheus
                    model:
                      refId: A
                      instant: true
                      expr: 'sum by (namespace, deployment) (kube_deployment_status_replicas_unavailable)'
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator: { type: gt, params: [0] }
              - uid: target-down
                title: Scrape target down
                condition: C
                for: 5m
                noDataState: OK
                execErrState: Error
                annotations:
                  summary: "A metrics endpoint has not answered for 5 minutes (labels say which)"
                data:
                  - refId: A
                    relativeTimeRange: { from: 600, to: 0 }
                    datasourceUid: prometheus
                    model:
                      refId: A
                      instant: true
                      expr: 'up'
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator: { type: lt, params: [1] }
      # Provisioned once by the chart, before Alertmanager was turned off.
      deleteDatasources:
        - { name: Alertmanager, orgId: 1 }
      additionalDataSources:
        - name: Loki
          uid: loki
          type: loki
          url: http://loki.monitoring.svc:3100
          access: proxy
        # The beyou database, read-only, for the product dashboard. The role can
        # only SELECT, and only in that database (data/postgres.yaml).
        - name: Beyou Postgres
          uid: beyou-postgres
          type: grafana-postgresql-datasource
          url: pg-rw.data.svc:5432
          user: beyou_readonly
          access: proxy
          editable: false
          jsonData:
            database: beyou
            sslmode: require
            postgresVersion: 1700
            maxOpenConns: 2
            maxIdleConns: 1
          secureJsonData:
            password: $BEYOU_DB_PASSWORD
        # Immich's own Postgres, read-only, for the bePresent dashboard. The
        # role can SELECT only the library tables (apps/immich/postgres.yaml).
        - name: Immich Postgres
          uid: immich-postgres
          type: grafana-postgresql-datasource
          url: immich-pg-rw.immich.svc:5432
          user: grafana_readonly
          access: proxy
          editable: false
          jsonData:
            database: immich
            sslmode: require
            postgresVersion: 1700
            maxOpenConns: 2
            maxIdleConns: 1
          secureJsonData:
            password: $IMMICH_DB_PASSWORD
      # The dashboard and datasource sidecars (~80Mi of Python each) run once,
      # as init containers, instead of watching for changes all day. A new or
      # changed dashboard ConfigMap therefore shows up after a Grafana restart:
      #   kubectl -n monitoring rollout restart deploy/grafana
      sidecar:
        dashboards:
          # Dashboards are ConfigMaps labelled grafana_dashboard=1 in any
          # namespace; the folder annotation groups them per app.
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
          # LIST: read once and exit (WATCH would never let the pod start).
          watchMethod: LIST
          initDashboards: true
          skipReload: true
        datasources:
          watchMethod: LIST
          initDatasources: true
          skipReload: true
          # There is no Alertmanager (alerts are Grafana-managed).
          alertmanager:
            enabled: false
