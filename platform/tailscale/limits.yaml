# The operator and one proxy pod per tailnet Ingress (Immich now, bePresent
# next). The proxies get the LimitRange defaults; tailscaled sits near 35Mi.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tailscale
  namespace: tailscale
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 256Mi
    limits.memory: 768Mi
    pods: "4"
    persistentvolumeclaims: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: tailscale
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 10m, memory: 32Mi }
      default: { memory: 128Mi }
