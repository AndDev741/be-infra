# The identity to sign in to Headlamp with. Kubernetes fills the token into the
# Secret below; nothing secret is committed. To read it:
#   kubectl -n headlamp get secret headlamp-admin-token -o jsonpath='{.data.token}' | base64 -d
# To revoke every session at once, delete the Secret; Flux recreates it with a
# new token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: headlamp
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-admin-token
  namespace: headlamp
  annotations:
    kubernetes.io/service-account.name: headlamp-admin
type: kubernetes.io/service-account-token
