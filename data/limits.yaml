# The shared Postgres. Today one instance (requests 256Mi, limit 768Mi) plus the
# operator's short-lived init and join jobs.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: data
  namespace: data
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 768Mi
    limits.memory: 2Gi
    pods: "10"
    persistentvolumeclaims: "4"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: data
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 20m, memory: 32Mi }
      default: { memory: 256Mi }
