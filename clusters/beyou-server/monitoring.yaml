# Separate from `platform` so a slow or broken monitoring rollout never holds
# back the ingress or the apps; the CRDs it installs (ServiceMonitor, PodMonitor,
# PrometheusRule) are what apps use to declare their own scraping.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: platform
  interval: 10m
  retryInterval: 2m
  path: ./platform/monitoring
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# Monitors need the Prometheus Operator CRDs, which only exist once the stack
# above is installed; a separate Kustomization keeps that ordering explicit.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-targets
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring
  interval: 10m
  retryInterval: 2m
  path: ./platform/monitoring/targets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
